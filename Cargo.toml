[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gitguard-core = { path = "crates/gitguard-core" }
gitguard-git = { path = "crates/gitguard-git" }
gitguard-policy = { path = "crates/gitguard-policy" }
gitguard-config = { path = "crates/gitguard-config" }
gitguard-ipc = { path = "crates/gitguard-ipc" }
gitguard-hook = { path = "crates/gitguard-hook" }
gitguard-audit = { path = "crates/gitguard-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
