[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gitguard-core = { path = "crates/gitguard-core" }
gitguard-policy = { path = "crates/gitguard-policy" }
