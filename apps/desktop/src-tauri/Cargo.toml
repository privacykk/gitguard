[package]
name = "gitguard-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "gitguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitguard-core.workspace = true
gitguard-config.workspace = true
gitguard-ipc.workspace = true
gitguard-git.workspace = true
gitguard-hook.workspace = true
serde.workspace = true
# 仓库 id：写进 Hook 脚本，CLI 用它把 Hook 与配置记录对应起来。
uuid.workspace = true
tauri = { version = "2", features = [] }
# 文件夹选择对话框：让用户挑选仓库目录，避免手写相对路径。
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# 仅测试用：断言 Tauri command 返回的 JSON 字段名与前端结构校验契约一致。
serde_json.workspace = true
