name: CI

on:
  # 仅支持在 Actions 页面手动触发；push 与 pull_request 不再自动运行。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm type-check
          pnpm test:frontend
          pnpm build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust and real Git Hook tests
        run: cargo test --workspace
